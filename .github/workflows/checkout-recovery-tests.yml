name: Checkout Recovery Tests

on:
  pull_request:
    paths:
      - 'app/api/cron/checkout-recovery/**'
      - 'app/admin/(operations)/checkout-recovery/**'
      - 'components/admin/checkout-recovery-manager.tsx'
      - 'components/order/checkout-flow.tsx'
      - 'components/order/cart-checkout-flow.tsx'
      - 'components/landing-pages/landing-order-form.tsx'
      - 'lib/orders/actions.ts'
      - 'lib/orders/schema.ts'
      - 'lib/commerce/checkout-recovery-actions.ts'
      - 'scripts/checkout-recovery-policy-test.ts'
      - 'supabase/migrations/*checkout_recovery_engine.sql'
      - 'vercel.json'
      - 'package.json'
      - '.github/workflows/checkout-recovery-tests.yml'

permissions:
  contents: read

concurrency:
  group: checkout-recovery-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checkout-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Install pnpm
        run: npm install --global pnpm@11.21.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run repository tests
        run: pnpm test
      - name: Lint recovery changes
        run: >-
          pnpm exec eslint
          app/api/cron/checkout-recovery/route.ts
          'app/admin/(operations)/checkout-recovery/page.tsx'
          components/admin/checkout-recovery-manager.tsx
          components/order/checkout-flow.tsx
          components/order/cart-checkout-flow.tsx
          components/landing-pages/landing-order-form.tsx
          lib/orders/actions.ts
          lib/orders/schema.ts
          lib/commerce/checkout-recovery-actions.ts
          scripts/checkout-recovery-policy-test.ts
      - name: Type-check
        run: pnpm exec tsc --noEmit
