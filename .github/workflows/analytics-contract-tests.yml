name: Analytics Contract Tests

on:
  pull_request:
    paths:
      - 'lib/analytics/**'
      - 'app/api/analytics/**'
      - 'scripts/analytics-contract-test.ts'
      - '.github/workflows/analytics-contract-tests.yml'
  push:
    branches: [main]
    paths:
      - 'lib/analytics/**'
      - 'app/api/analytics/**'
      - 'scripts/analytics-contract-test.ts'
      - '.github/workflows/analytics-contract-tests.yml'

permissions:
  contents: read

concurrency:
  group: analytics-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analytics-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Install pnpm
        run: npm install --global pnpm@11.21.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint analytics changes
        run: >-
          pnpm exec eslint
          app/api/analytics/route.ts
          components/analytics/analytics-provider.tsx
          components/cart/cart-client.tsx
          components/order/order-success.tsx
          components/product/product-detail-interactive.tsx
          lib/analytics/browser-registry.ts
          lib/analytics/client.ts
          lib/analytics/events.ts
          lib/analytics/ingestion-policy.ts
          lib/analytics/provider-adapters.ts
          lib/analytics/server.ts
          scripts/analytics-contract-test.ts

      - name: Run commerce and analytics contract tests
        run: pnpm test
